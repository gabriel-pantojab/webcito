name: Format Check

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check
